[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixretouch"
version = "0.1.0"
description = "Agent-native photo retouching pipeline for DSH — whitebox replica of PixCake architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",  # 2.x API：MCPServer（v1 的 mcp.server.fastmcp 已移除）
  "pillow>=10",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "mediapipe>=0.10",
  "insightface>=0.7",  # ArcFace 嵌入（工单 05 人物聚类）；onnxruntime 版本与工单 08 共用
  "onnxruntime>=1.19",  # ISNet 抠图 + Depth-Anything-V2 深度（ONNX 权重，CPU EP 保确定性）
  "torch>=2.3",
  "huggingface_hub>=0.24",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pixretouch = "pixretouch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pixretouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
